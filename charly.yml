charly-internals:
    candy:
        description: |-
            Concept candy owning the charly-internals contributor skills (go/plugin/agents/skills/cutover/…). Owns its family's `skill:` kind entities (sibling nodes in this file) — the
            the plugins→candies migration; candy/plugin-marketplace regenerates the marketplace
            corpus (the standalone opencharly/marketplace repo) from them.
        plan:
            - run: this documentation-only candy ships no install content (it carries the family's skill/hook/marketplace entities); validate-satisfying no-op
              command: "true"
              context:
                - build
            - check: the internals concept candy's skill entities are present and generated into the marketplace's internals/skills
              id: charly-internals-present
              context:
                - build
              command: "true"
agents-skill:
    skill:
        name: agents
        family: internals
        owner: charly-internals
        triggers:
            - "Verify a cutover by running the R10 beds (drive `charly check run <bed>`)"
            - "Evaluate/audit a deployment config (image or deploy, yours)"
            - "Sub-agents / dynamic workflows / agent teams / agent-lifecycle or commit-push gate hooks"
            - "Monitor a subagent's progress / stop a stalled, idle, or looping worker"
            - "Todo ledger / interruption safety / never drop in-flight work across a new instruction"
