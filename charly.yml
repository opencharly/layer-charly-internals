charly-internals:
    candy:
        description: |-
            Concept candy carrying the routing metadata for the internals skills that still need it
            here: `agents`, `cutover-policy` and `root-cause-analyzer` (their bodies already live in
            the umbrella, which is not yet a corpus source) plus `egress`, `git-workflow`, `go`,
            `go-quality`, `marketplace`, `plugin`, `repo-setup` and `vm-deploy-target` (no other repo
            authors them yet). Ships no install content; owns its family's `skill:` kind entities
            (sibling nodes in this file), and candy/plugin-marketplace regenerates the marketplace
            corpus (the standalone opencharly/marketplace repo) from them.
        plan:
            - run: this documentation-only candy ships no install content (it carries the remaining internals family's skill entities); validate-satisfying no-op
              command: "true"
              context:
                - build
            - check: validate-satisfying no-op — this assertion is NOT performed by the command, the real body-existence gate is `charly box validate`
              id: charly-internals-present
              context:
                - build
              command: "true"
agents-skill:
    skill:
        name: agents
        family: internals
        owner: charly-internals
        triggers:
            - "Verify a cutover by running the R10 beds (drive `charly check run <bed>`)"
            - "Evaluate/audit a deployment config (image or deploy, yours)"
            - "Sub-agents / dynamic workflows / agent teams / agent-lifecycle or commit-push gate hooks"
            - "Monitor a subagent's progress / stop a stalled, idle, or looping worker"
            - "Todo ledger / interruption safety / never drop in-flight work across a new instruction"
cutover-policy-skill:
    skill:
        name: cutover-policy
        family: internals
        owner: charly-internals
        triggers:
            - "Hard-cutover concerns / rename sweeps"
egress-skill:
    skill:
        name: egress
        family: internals
        owner: charly-internals
        triggers:
            - "Egress config validation \u2014 validating/generating the config files charly WRITES to a system (`candy/plugin-fleet/egress.go`, `ValidateEgress`, the vendored CUE egress schemas in `candy/plugin-egress/egress-schemas/vendor/`, cloud-init/k8s_object/units/ssh_config/libvirt-XML egress)"
git-workflow-skill:
    skill:
        name: git-workflow
        family: internals
        owner: charly-internals
        triggers:
            - "Git/`gh` workflow \u2014 `feat/` branch, commit, PR-only landing (NO direct push to main), branch protection, the `pr-validator` fresh-evaluator gate, native auto-merge + tag-on-merge CalVer-at-merge, worktree, sync-to-upstream, branch/worktree prune, cross-repo R10 landing"
go-skill:
    skill:
        name: go
        family: internals
        owner: charly-internals
        triggers:
            - "Go source work (adding/modifying `charly` commands)"
            - "Editing `sdk/schema/*.cue` / `charly task cue-gen` / `cue exp gengotypes` / generated `cue_types_gen.go` / Schema Driven Design (SDD) / a schema spike"
go-quality-skill:
    skill:
        name: go-quality
        family: internals
        owner: charly-internals
        triggers:
            - "Go code-quality / AGENTS.md-compliance audit / `golangci-lint` / `dupl` / duplication or dead-code check / `.golangci.yml`"
plugin-skill:
    skill:
        name: plugin
        family: internals
        owner: charly-internals
        triggers:
            - "Authoring a plugin (a candy with a `plugin:` block) / builtin vs out-of-tree plugin / per-plugin `.cue` schema (single source \u2192 `gengotypes` for dev + schema-over-`Describe` RPC at runtime) / the plugin SDK (`github.com/opencharly/sdk`, the proxy-resolved contract module — no submodule) / `sdk/**` / a compiled-in plugin candy (`compiled_plugins:`) or host-coupled kit candy / an external plugin module"
            - "Editing `sdk/schema/*.cue` / `charly task cue-gen` / `cue exp gengotypes` / generated `cue_types_gen.go` / Schema Driven Design (SDD) / a schema spike"
root-cause-analyzer-skill:
    skill:
        name: root-cause-analyzer
        family: internals
        owner: charly-internals
vm-deploy-target-skill:
    skill:
        name: vm-deploy-target
        family: internals
        owner: charly-internals
        triggers:
            - "`charly update` / `charly vm *` / VM entities in `vm.yml` or `vm:`"
marketplace-skill:
    skill:
        name: marketplace
        family: internals
        owner: charly-internals
        triggers:
            - "Marketplace / skill-corpus generation — `charly marketplace generate`, the refs list (candy/charly-marketplace/charly.yml), the drift gate, the daily refresh PRs, per-harness vendoring, or 'my skill is stale'"
repo-setup-skill:
    skill:
        name: repo-setup
        family: internals
        owner: charly-internals
        triggers:
            - "Set up a new repository in the opencharly org (required workflows, ruleset, auto-merge, CalVer tags)"
            - "How the org ruleset / dotgithub workflows / native auto-merge / tag-on-merge CalVer work"
