charly-internals:
    candy:
        description: |-
            Concept candy carrying NO skill entity: every one of the `internals` family's skills is
            authored in the repo that owns the code, plugin, or config it describes, and this repo is
            retired (opencharly/opencharly#611, AGENTS.md Part II #5). The other eighteen were drained
            earlier — nine to `sdk`/`spec` (opencharly/layer-charly-internals#139), six to `charly` and
            the three plugin repos (#142), three to the umbrella (#143) — and this change drains the
            last two, `git-workflow` and `repo-setup`, to the umbrella, a DIRECT corpus source. Ships no
            install content, and candy/plugin-marketplace regenerates the marketplace corpus (the
            standalone opencharly/marketplace repo) from the owning repos' own files.
        plan:
            - run: this documentation-only candy ships no install content and carries no skill entity; validate-satisfying no-op
              command: "true"
              context:
                - build
            - check: validate-satisfying no-op — this assertion is NOT performed by the command, and this candy owns no `skill:` node, so no body exists for it to resolve; the structural gate is `charly box validate`
              id: charly-internals-present
              context:
                - build
              command: "true"
